<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="description" content="Fast & secure URL shortener" />
  <title>Snip</title>
  <link rel="icon" href="/snipmyvnc.jpg" type="image/jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<!-- Redirect overlay -->
<div id="redirectOverlay">
  <div class="redirect-box">
    <div class="spinner" id="redirectSpinner"></div>
    <h3 id="redirectTitle">Redirecting...</h3>
    <p id="redirectUrl"></p>
    <div class="countdown" id="redirectCountdown" style="display:none">3</div>
    <div class="redirect-actions" id="redirectActions" style="display:none">
      <button class="btn btn-ghost" id="cancelRedirectBtn">Cancel</button>
      <button class="btn" id="gotoBtn">Go Now →</button>
    </div>
  </div>
</div>

<!-- HOME VIEW -->
<div class="container" id="homeView">
  <div class="header">
    <div class="logo">
      <img src="/snipmyvnc.jpg" alt="Snip" class="logo-img" />
      <span>MyVNC Snip</span>
    </div>
    <button class="theme-btn" id="themeBtn" title="Toggle theme">
      <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
    </button>
  </div>

  <div class="card">
    <h2>Shorten a URL</h2>

    <div class="field">
      <label>Long URL</label>
      <div class="input-wrap">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <input type="url" id="longUrl" placeholder="https://example.com/very/long/url" autocomplete="off" />
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label>Custom alias <span class="opt">(optional)</span></label>
        <div class="input-wrap has-prefix">
          <span class="input-prefix">url.myvnc.com/</span>
          <input type="text" id="customCode" placeholder="mylink" autocomplete="off" maxlength="20" />
        </div>
      </div>
      <div class="field">
        <label>Expires in <span class="opt">(optional)</span></label>
        <div class="input-wrap">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <input type="number" id="expiryDays" placeholder="Days (e.g. 7)" min="1" max="3650" />
        </div>
      </div>
    </div>

    <button class="btn" id="shortenBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      Shorten URL
    </button>

    <div class="result" id="result">
      <div class="result-label">Your short link</div>
      <div class="result-url">
        <a id="shortUrl" href="#" target="_blank" rel="noopener"></a>
        <button class="icon-btn" id="copyBtn" title="Copy">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
        <button class="icon-btn" id="qrBtn" title="Show QR">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h.01M14 21h.01M21 14h.01M21 21h.01"/></svg>
        </button>
      </div>
      <div class="qr-wrap" id="qrWrap">
        <div id="qrcode"></div>
        <div class="qr-actions">
          <button class="share-btn" id="downloadQrBtn">Download QR</button>
        </div>
      </div>
      <div class="share-row">
        <button class="share-btn" data-share="whatsapp">
          <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
          WhatsApp
        </button>
        <button class="share-btn" data-share="twitter">
          <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          X
        </button>
        <button class="share-btn" data-share="telegram">
          <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
          Telegram
        </button>
        <button class="share-btn" data-share="native">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          Share
        </button>
      </div>
    </div>
  </div>

  <div class="card" id="recentCard">
    <h2>My Links <span class="badge" id="recentCount">0</span></h2>
    <div class="recent-list" id="recentList">
      <div class="empty-state">Abhi tak koi link nahi banaya</div>
    </div>
  </div>

  <div class="footer">
    Made with 💜 · <a href="https://url.myvnc.com">url.myvnc.com</a>
  </div>
</div>

<!-- ADMIN VIEW -->
<div class="container" id="adminView" style="display:none">
  <div class="header">
    <div class="logo">
      <img src="/snipmyvnc.jpg" alt="Snip" class="logo-img" />
      <span>Admin Panel</span>
    </div>
    <button class="theme-btn" id="themeBtnAdmin" title="Toggle theme">
      <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
    </button>
  </div>

  <!-- Login -->
  <div class="card" id="adminLoginCard">
    <h2>🔒 Admin Login</h2>
    <div class="field">
      <label>Password</label>
      <div class="input-wrap">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="adminPassword" placeholder="Enter admin password" autocomplete="off" />
      </div>
    </div>
    <button class="btn" id="adminLoginBtn">Login</button>
  </div>

  <!-- Admin panel -->
  <div class="card" id="adminPanelCard" style="display:none">
    <h2>📊 All Links <span class="badge" id="adminLinkCount">0</span></h2>
    <div class="field" style="margin-bottom:16px">
      <div class="input-wrap">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="adminSearch" placeholder="Search by code or URL..." />
      </div>
    </div>
    <div id="adminList">
      <div class="empty-state">Loading...</div>
    </div>
    <button class="btn btn-ghost" id="adminLogoutBtn" style="margin-top:16px">Logout</button>
  </div>

  <div class="footer">
    Admin · <a href="/">← Back to site</a>
  </div>
</div>

<script src="/app.js" type="module"></script>
</body>
</html>
